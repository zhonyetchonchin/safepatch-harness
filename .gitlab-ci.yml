stages:
  - test
  - package

unit-test:
  image: python:3.12-slim
  stage: test
  before_script:
    - python -m pip install --upgrade pip
  script:
    - python -m pip install -e ".[dev]"
    - python -m pytest -q

docker-build:
  image: docker:29
  stage: package
  services:
    - docker:29-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker build -t safepatch .
  rules:
    - if: $CI_COMMIT_BRANCH
