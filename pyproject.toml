[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "safepatch"
version = "0.1.0"
description = "A local coding agent harness with deterministic governance and HITL."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=46,<47",
    "fastapi>=0.125,<1",
    "pydantic>=2.7,<3",
    "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.9,<3",
    "pytest>=9,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
safepatch = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
